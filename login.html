<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farm Ledger — Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/farm-ledger.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<style>body{min-height:100vh;background:#f4f7f4}.login-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.auth-box{width:min(420px,100%)}#login-error,#login-success{display:none;padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}.brand{text-align:center;margin-bottom:18px}.brand i{font-size:48px;color:#2e7d32}.brand h1{margin:8px 0 3px;font-size:27px}.brand p{color:#777;margin:0}</style>
</head>
<body>
<div class="login-page"><div class="auth-box">
<div class="brand"><i class="fas fa-leaf"></i><h1>Farm Ledger</h1><p>Professional Edition</p></div>
<div id="login-error"></div><div id="login-success"></div>
<div id="login-panel">
<p id="auth-title">Sign in to your account</p>
<input id="email" class="input" type="email" placeholder="Email Address" autocomplete="email" maxlength="160">
<input id="password" class="input" type="password" placeholder="Password" autocomplete="current-password" maxlength="128">
<button id="email-btn" class="main-btn">Login</button>
<button id="google-btn" class="google-btn"><i class="fab fa-google" style="color:#db4437"></i> Sign in with Google</button>
<button id="forgot-password" class="auth-link" type="button">Forgot password?</button>
<button id="auth-toggle" class="auth-toggle" type="button">Need an account? Register here</button>
</div>
</div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBNEK3cSaxK0pEI1sOufrVpQkhf2ENK-rw",authDomain:"goatledger-132c7.firebaseapp.com",projectId:"goatledger-132c7",storageBucket:"goatledger-132c7.firebasestorage.app",messagingSenderId:"576591882291",appId:"1:576591882291:web:9d540d6c99150a63e81b46"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),googleProvider=new firebase.auth.GoogleAuthProvider();let loginMode=true;
const $=id=>document.getElementById(id);function message(id,text){const e=$(id);e.textContent=text;e.style.display=text?'block':'none';}
function friendly(e){const m=(e?.message||'').toLowerCase();if(m.includes('invalid')||m.includes('wrong-password')||m.includes('user-not-found'))return'Invalid email or password.';if(m.includes('email-already'))return'This email address is already registered.';if(m.includes('weak-password'))return'Password must be at least 8 characters.';if(m.includes('too-many'))return'Too many attempts. Please wait and try again.';return e?.message||'An unexpected error occurred.';}
function go(){location.replace('./dashboard.html');}
auth.onAuthStateChanged(function(user){if(user){if(!user.emailVerified){return;}go();}});
$('auth-toggle').onclick=function(){loginMode=!loginMode;$('auth-title').textContent=loginMode?'Sign in to your account':'Create a new account';$('email-btn').textContent=loginMode?'Login':'Sign Up';$('auth-toggle').textContent=loginMode?'Need an account? Register here':'Already have an account? Login here';$('forgot-password').style.display=loginMode?'block':'none';};
$('email-btn').onclick=async function(){const email=$('email').value.trim().toLowerCase(),password=$('password').value;if(!email||!password)return message('login-error','Enter your email and password.');if(!loginMode&&password.length<8)return message('login-error','Password must be at least 8 characters.');this.disabled=true;try{if(loginMode){const c=await auth.signInWithEmailAndPassword(email,password);if(!c.user.emailVerified){message('login-error','Please verify your email before continuing.');await auth.signOut();}}else{const c=await auth.createUserWithEmailAndPassword(email,password);if(c.user&&!c.user.emailVerified){await c.user.sendEmailVerification({url:location.origin+location.pathname,handleCodeInApp:false});message('login-success','Account created. Check your email to verify your account.');await auth.signOut();}}}catch(e){message('login-error',friendly(e));}finally{this.disabled=false;this.textContent=loginMode?'Login':'Sign Up';}};
$('google-btn').onclick=async function(){try{const c=await auth.signInWithPopup(googleProvider);if(!c.user.emailVerified){message('login-error','Please verify your email before continuing.');await auth.signOut();}}catch(e){message('login-error',friendly(e));}};
$('forgot-password').onclick=async function(){const email=$('email').value.trim().toLowerCase();if(!email)return message('login-error','Enter your email address first.');try{await auth.sendPasswordResetEmail(email);message('login-success','Password reset email sent.');}catch(e){message('login-error',friendly(e));}};
</script>
</body></html>
