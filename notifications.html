<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Farm Ledger - Notifications</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/farm-ledger.css"><link rel="manifest" href="/Farm-ledger/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
</head><body><div id="error-box" style="display:none"></div><div id="success-box" style="display:none"></div><div id="splash-view"></div><div id="app-view"><div id="admin-notifications" class="hidden">
<div class="card admin-action-card">
<h3><i class="fas fa-bell" style="color:#2e7d32"></i> Send Notification</h3>
<div class="form-group"><label>Target Farm</label><select id="notification-farm" class="form-input"><option value="">Select a farm...</option></select></div>
<div class="form-group"><label>Notification Type</label><select id="notification-type" class="form-input"><option value="in_app">In-App Only</option><option value="bar">Phone Notification Bar Only</option><option value="both">In-App + Phone Notification Bar</option></select></div>
<div class="form-group"><label>Title</label><input id="notification-title" class="form-input" maxlength="80" placeholder="Notification title"></div>
<div class="form-group"><label>Message</label><textarea id="notification-message" class="form-input" maxlength="300" rows="4" placeholder="Write the notification message..."></textarea></div>
<button id="send-notification-btn" class="main-btn" style="margin-bottom:0"><i class="fas fa-paper-plane"></i> Send Notification</button>
</div>
<div class="card admin-action-card">
<h3><i class="fas fa-list" style="color:#2e7d32"></i> Recent Notifications</h3>
<div id="admin-notification-list"><p style="text-align:center;color:#888;font-size:12px">No notifications sent yet.</p></div>
</div>
</div>
</div>
<script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
