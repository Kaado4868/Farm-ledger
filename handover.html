<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Farm Ledger - Livestock Handover</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/farm-ledger.css"><link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
</head><body data-farm-ledger-page="handover"><div id="error-box" style="display:none"></div><div id="success-box" style="display:none"></div><div id="splash-view"></div><div id="app-view" class="app hidden"><div class="header">
<div><h1 id="app-header-title"><i class="fas fa-leaf"></i> Farm Ledger</h1><small id="farm-name">Farm: Loading...</small></div>
<div id="sync-status-bar" role="status" aria-live="polite"><i class="fas fa-cloud"></i><span id="sync-status-text">Synced</span></div>
<div class="header-actions">
<button id="install-app-btn" title="Install Farm Ledger"><i class="fas fa-download"></i> Install</button>
<div class="notification-btn-wrap"><button id="notification-btn" class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button><span id="notification-badge" class="notification-badge">0</span></div>
<button id="switch-farm-btn" class="icon-btn hidden" title="Switch Farm"><i class="fas fa-exchange-alt"></i></button>
<button id="logout" class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
</div></div>
<div id="notification-panel" class="notification-panel"><div class="notification-panel-head"><span><i class="fas fa-bell" style="color:#2e7d32"></i> Notifications</span><button id="notification-close" class="icon-btn" title="Close"><i class="fas fa-times"></i></button></div><div id="phone-notification-enable-row"><button id="enable-phone-notifications" type="button" class="secondary-btn">Enable Phone Notifications</button></div><div id="notification-list"><p style="padding:18px;text-align:center;color:#888;font-size:12px">No notifications.</p></div></div><div class="content"><div id="sub-handover" class="sub-screen">
<div class="card" style="margin-bottom:0">
<h3><i class="fas fa-hand-holding-heart" style="color:#2e7d32"></i> Livestock Handover</h3>
<p class="handover-note">Use this for livestock given to a herdsman or caretaker for care while the animals remain yours. It is a custody/movement record, separate from a herdsman payment.</p>
<input type="hidden" id="handover-id">
<div class="form-group"><label>Date of Handover</label><input id="handover-date" class="form-input" type="date"></div>
<div class="herdsman-contact-grid">
<div class="form-group"><label>Herdsman / Caretaker Name</label><input id="handover-name" class="form-input" type="text" maxlength="100" placeholder="Full name"></div>
<div class="form-group"><label>Phone Number</label><input id="handover-phone" class="form-input" type="tel" maxlength="30" placeholder="080..."></div>
</div>
<div class="form-group" style="margin-top:14px"><label>Destination / Where Livestock Will Stay</label><input id="handover-location" class="form-input" type="text" maxlength="150" placeholder="e.g. grazing field, village or ranch"></div><div class="herdsman-contact-grid"><div class="form-group"><label>Purpose of Handover</label><select id="handover-purpose" class="form-input"><option value="grazing">Grazing / Daily Care</option><option value="breeding">Breeding</option><option value="treatment">Treatment / Recovery</option><option value="security">Security / Safekeeping</option><option value="other">Other</option></select></div><div class="form-group"><label>Expected Return Date <span style="font-weight:400;color:#888">(optional)</span></label><input id="handover-return-date" class="form-input" type="date"></div></div><div class="form-group"><label>Number of Livestock</label><input id="handover-livestock-count" class="form-input" type="number" min="1" max="100" value="1"></div>
<div id="handover-livestock-list"></div>
<div class="form-group"><label>Handover Photo Evidence <span style="font-weight:400;color:#888">(up to 3 photos)</span></label><input id="handover-photos" class="form-input" type="file" accept="image/*" capture="environment" multiple><div id="handover-photo-preview" class="handover-photo-preview"></div></div><div class="form-group"><label>Notes</label><input id="handover-notes" class="form-input" type="text" maxlength="300" placeholder="Purpose, instructions or other notes"></div><button id="save-handover" class="main-btn" type="button"><i class="fas fa-save"></i> Save Handover</button>
</div></div><div class="nav">
<div class="nav-item" data-screen="dashboard"><i class="fas fa-chart-line"></i>Dashboard</div>
<div class="nav-item" data-screen="chat"><i class="fas fa-comments"></i>Chat<span id="chat-nav-badge" class="notification-badge" style="position:static;margin-left:4px">0</span></div>
<div class="nav-item" data-screen="manage"><i class="fas fa-folder-open"></i>Manage</div>
<div id="admin-nav" class="nav-item hidden" data-screen="admin"><i class="fas fa-shield-alt"></i>Admin</div>
</div>
</div>
<script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
