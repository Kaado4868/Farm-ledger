<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Farm Ledger - Admin Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/farm-ledger.css"><link rel="manifest" href="/Farm-ledger/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png"><link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
</head><body><div id="error-box" style="display:none"></div><div id="success-box" style="display:none"></div><div id="splash-view"></div><div id="app-view"><div id="admin-chat" class="hidden">
<div class="card admin-action-card">
<h3><i class="fas fa-comments" style="color:#2e7d32"></i> Create Chat</h3>
<div class="form-group"><label>Farm</label><select id="chat-farm" class="form-input"><option value="">Select a farm...</option></select></div>
<div class="form-group"><label>Chat Name</label><input id="chat-name" class="form-input" maxlength="80" placeholder="e.g. Farm Management"></div>
<div class="form-group"><label>Select Members</label><div id="chat-members" style="max-height:220px;overflow:auto;border:1px solid #ddd;border-radius:8px;padding:8px"><p style="color:#888;font-size:12px">Select a farm first.</p></div></div>
<button id="create-chat-btn" class="main-btn"><i class="fas fa-plus"></i> Create Chat</button>
</div></div>
<script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
