<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Ledger">
<title>Farm Ledger - Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/farm-ledger.css">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
</head>
<body data-farm-ledger-page="chat">
<div id="error-box" style="display:none"></div>
<div id="success-box" style="display:none"></div>
<div id="splash-view"></div>
<div id="app-view" class="app hidden"><div class="header">
<div><h1 id="app-header-title"><i class="fas fa-leaf"></i> Farm Ledger</h1><small id="farm-name">Farm: Loading...</small></div>
<div id="sync-status-bar" role="status" aria-live="polite"><i class="fas fa-cloud"></i><span id="sync-status-text">Synced</span></div>
<div class="header-actions">
<button id="install-app-btn" title="Install Farm Ledger"><i class="fas fa-download"></i> Install</button>
<div class="notification-btn-wrap"><button id="notification-btn" class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button><span id="notification-badge" class="notification-badge">0</span></div>
<button id="switch-farm-btn" class="icon-btn hidden" title="Switch Farm"><i class="fas fa-exchange-alt"></i></button>
<button id="logout" class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
</div></div>
<div id="notification-panel" class="notification-panel"><div class="notification-panel-head"><span><i class="fas fa-bell" style="color:#2e7d32"></i> Notifications</span><button id="notification-close" class="icon-btn" title="Close"><i class="fas fa-times"></i></button></div><div id="phone-notification-enable-row"><button id="enable-phone-notifications" type="button" class="secondary-btn">Enable Phone Notifications</button></div><div id="notification-list"><p style="padding:18px;text-align:center;color:#888;font-size:12px">No notifications.</p></div></div><div class="content">
<div id="chat" class="screen">
<div class="card chat-panel">
<div id="chat-list-view"><h3 style="margin-top:0"><i class="fas fa-comments" style="color:#2e7d32"></i> Chats</h3><div id="chat-list" class="chat-list"><div class="chat-empty">No chats available.</div></div></div>
<div id="chat-window" class="chat-window">
<div class="chat-window-head"><button class="chat-back" id="chat-back" type="button"><i class="fas fa-arrow-left"></i></button><div><div id="chat-window-title" style="font-weight:800;font-size:14px">Chat</div><div id="chat-window-members" style="font-size:9px;color:#888"></div></div></div>
<div id="chat-messages" class="chat-messages"></div><div class="chat-compose"><textarea id="chat-input" class="form-input" rows="1" maxlength="1000" placeholder="Type a message..."></textarea><button id="chat-send" class="chat-send" type="button"><i class="fas fa-paper-plane"></i></button></div>
</div></div></div>
</div><div class="nav">
<div class="nav-item" data-screen="dashboard"><i class="fas fa-chart-line"></i>Dashboard</div>
<div class="nav-item" data-screen="chat"><i class="fas fa-comments"></i>Chat<span id="chat-nav-badge" class="notification-badge" style="position:static;margin-left:4px">0</span></div>
<div class="nav-item" data-screen="manage"><i class="fas fa-folder-open"></i>Manage</div>
<div id="admin-nav" class="nav-item hidden" data-screen="admin"><i class="fas fa-shield-alt"></i>Admin</div>
</div>
</div>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
