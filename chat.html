<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b5e20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Farm Ledger">
<title>Farm Ledger - Chat</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<link rel="stylesheet" href="css/farm-ledger.css">
<link rel="manifest" href="/Farm-ledger/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180.png">
</head>
<body>
<div id="error-box" style="display:none"></div>
<div id="success-box" style="display:none"></div>
<div id="splash-view"></div>
<div id="app-view">
<div id="chat" class="screen">
<div class="card chat-panel">
<div id="chat-list-view"><h3 style="margin-top:0"><i class="fas fa-comments" style="color:#2e7d32"></i> Chats</h3><div id="chat-list" class="chat-list"><div class="chat-empty">No chats available.</div></div></div>
<div id="chat-window" class="chat-window">
<div class="chat-window-head"><button class="chat-back" id="chat-back" type="button"><i class="fas fa-arrow-left"></i></button><div><div id="chat-window-title" style="font-weight:800;font-size:14px">Chat</div><div id="chat-window-members" style="font-size:9px;color:#888"></div></div></div>
<div id="chat-messages" class="chat-messages"></div><div class="chat-compose"><textarea id="chat-input" class="form-input" rows="1" maxlength="1000" placeholder="Type a message..."></textarea><button id="chat-send" class="chat-send" type="button"><i class="fas fa-paper-plane"></i></button></div>
</div></div></div>
</div>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
