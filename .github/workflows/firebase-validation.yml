name: Firebase validation

on:
  push:
    branches:
      - security/firebase-farm-isolation
  pull_request:
    branches:
      - main
      - security/firebase-farm-isolation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install function dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Syntax check
        run: |
          node --check functions/index.js
          node --check scripts/migrate-to-secure-schema.js

      - name: Validate Firebase configuration JSON
        run: |
          node -e "JSON.parse(require('fs').readFileSync('firebase.json','utf8')); JSON.parse(require('fs').readFileSync('firestore.indexes.json','utf8')); JSON.parse(require('fs').readFileSync('functions/package.json','utf8')); JSON.parse(require('fs').readFileSync('scripts/package.json','utf8')); console.log('JSON validation passed')"

      - name: Check migration safety guards
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const s = fs.readFileSync('scripts/migrate-to-secure-schema.js', 'utf8');
          const required = [
            'const DRY_RUN = process.env.DRY_RUN !== "false";',
            'if (!DRY_RUN && CONFIRM_MIGRATION !== "YES")',
            'if (!DRY_RUN) await userRef.set',
            'if (!DRY_RUN) await ref.set(data, { merge: true });',
            'if (!DRY_RUN) await auth.setCustomUserClaims'
          ];
          for (const marker of required) {
            if (!s.includes(marker)) throw new Error('Missing migration safety guard: ' + marker);
          }
          console.log('Migration safety guards present; no production migration executed.');
          NODE

      - name: Validate Firestore rules with emulator
        run: |
          npx --yes firebase-tools@latest emulators:exec --project goatledger-132c7 --only firestore "node -e \"console.log('Firestore rules loaded successfully')\""
