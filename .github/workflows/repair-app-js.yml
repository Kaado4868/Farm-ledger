name: Repair app.js syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair missing JavaScript closures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('js/app.js')
          s = p.read_text()
          replacements = [
              ('btn.textContent=loginMode?"Login":"Sign Up";};\n$("google-btn")', 'btn.textContent=loginMode?"Login":"Sign Up";}};\n$("google-btn")'),
              ('btn.textContent=$("record-id").value?"Update Record":"Save Record";};\nfunction editRecord', 'btn.textContent=$("record-id").value?"Update Record":"Save Record";}};\nfunction editRecord'),
              ('btn.innerHTML=$("handover-id").value?\'<i class="fas fa-save"></i> Update Handover\':\'<i class="fas fa-save"></i> Save Handover\';};\nfunction editHandoverRecord', 'btn.innerHTML=$("handover-id").value?\'<i class="fas fa-save"></i> Update Handover\':\'<i class="fas fa-save"></i> Save Handover\';}};\nfunction editHandoverRecord'),
          ]
          changed = False
          for old, new in replacements:
              if old in s:
                  s = s.replace(old, new, 1)
                  changed = True
          if not changed:
              print('No repair needed')
          else:
              p.write_text(s)
          PY

      - name: Validate JavaScript syntax
        run: node --check js/app.js

      - name: Commit repair
        if: success()
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "Fix remaining app.js syntax errors"
          git push