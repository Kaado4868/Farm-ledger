name: Deploy Farm Ledger to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          projectId: goatledger-132c7
          channelId: live

      - name: Deploy Firestore security rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm install --no-save --no-package-lock firebase-admin@latest
          node <<'NODE'
          const fs = require("fs");
          const admin = require("firebase-admin");
          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            projectId: "goatledger-132c7"
          });
          const source = fs.readFileSync("firestore.rules", "utf8");
          const rules = admin.securityRules();
          (async () => {
            try {
              const ruleset = await rules.createRuleset({
                source: { files: [{ name: "firestore.rules", content: source }] }
              });
              await rules.releaseFirestoreRuleset("cloud.firestore", ruleset.name);
              console.log("Firestore rules deployed:", ruleset.name);
            } catch (error) {
              console.error("Firestore rules deployment failed:", error);
              process.exit(1);
            }
          })();
          NODE
