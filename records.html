<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#1b5e20"><title>Farm Ledger - Records History</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script><link rel="stylesheet" href="css/farm-ledger.css"><link rel="manifest" href="/Farm-ledger/manifest.webmanifest"></head><body data-farm-ledger-page="records"><div id="splash-view"></div><div id="app-view" class="app hidden"><div class="header">
<div><h1 id="app-header-title"><i class="fas fa-leaf"></i> Farm Ledger</h1><small id="farm-name">Farm: Loading...</small></div>
<div id="sync-status-bar" role="status" aria-live="polite"><i class="fas fa-cloud"></i><span id="sync-status-text">Synced</span></div>
<div class="header-actions">
<button id="install-app-btn" title="Install Farm Ledger"><i class="fas fa-download"></i> Install</button>
<div class="notification-btn-wrap"><button id="notification-btn" class="icon-btn" title="Notifications"><i class="fas fa-bell"></i></button><span id="notification-badge" class="notification-badge">0</span></div>
<button id="switch-farm-btn" class="icon-btn hidden" title="Switch Farm"><i class="fas fa-exchange-alt"></i></button>
<button id="logout" class="icon-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
</div></div>
<div id="notification-panel" class="notification-panel"><div class="notification-panel-head"><span><i class="fas fa-bell"></i> Notifications</span><button id="notification-close" class="icon-btn" title="Close"><i class="fas fa-times"></i></button></div><div id="phone-notification-enable-row"><button id="enable-phone-notifications" type="button" class="secondary-btn">Enable Phone Notifications</button></div><div id="notification-list"><p>No notifications.</p></div></div><div class="content"><div id="records" class="screen active"><div id="sub-history" class="sub-screen">
<div class="history-tools">
<select id="history-filter" aria-label="Category">
<option value="all">All Categories</option>
<option value="purchase">Purchases</option>
<option value="medical">Medical</option>
<option value="feed">Feed</option>
<option value="herdsman">Herdsman Payments</option>
<option value="handover">Livestock Handovers</option>
<option value="death">Deaths / Losses</option>
<option value="other">Other</option>
</select>
<select id="history-animal-filter" aria-label="Animal">
<option value="all">All Animals</option>
<option value="goat">Goats</option>
<option value="sheep">Sheep</option>
<option value="cattle">Cattle</option>
<option value="chicken">Chicken</option>
<option value="other">Other</option>
</select>
<div class="history-date-box">
<label class="history-filter-label" for="history-from">From date</label>
<input id="history-from" class="form-input" type="date" aria-label="From date">
</div>
<div class="history-date-box">
<label class="history-filter-label" for="history-to">To date</label>
<input id="history-to" class="form-input" type="date" aria-label="To date">
</div>
<div class="history-search-wrap">
<input id="history-search" class="form-input" type="search" placeholder="Search description, author or animal...">
</div>
</div>
<div id="history-list"></div>
</div>


<div class="page-section-nav" style="display:flex;gap:8px;overflow-x:auto;margin-bottom:12px">
<button type="button" class="manage-tab active" data-sub="sub-history">Records History</button>
<button type="button" class="manage-tab" data-sub="sub-form">Add Record</button>
<button type="button" class="manage-tab" data-sub="sub-handover">Handover</button>
</div>
</div></div><div class="nav"><div class="nav-item" data-screen="dashboard"><i class="fas fa-chart-line"></i>Dashboard</div><div class="nav-item" data-screen="chat"><i class="fas fa-comments"></i>Chat<span id="chat-nav-badge" class="notification-badge" style="position:static;margin-left:4px">0</span></div><div class="nav-item active" data-screen="manage"><i class="fas fa-folder-open"></i>Manage</div><div id="admin-nav" class="nav-item hidden" data-screen="admin"><i class="fas fa-shield-alt"></i>Admin</div></div></div><script src="js/app.js"></script><script src="js/pwa.js"></script></body></html>
